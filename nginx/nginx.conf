# ========================================
# HTTP：仅保留健康检查，其余全部跳转 HTTPS
# ========================================
server {
    listen 80;
    server_name ai.hitech.xin www.ai.hitech.xin;

    # 健康检查入口（负载均衡可能仍通过 HTTP 探测）
    location /hitech/health {
        access_log off;
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 所有其他请求 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================
# HTTPS：主业务服务
# ========================================
server {
    listen 443 ssl;
    server_name ai.hitech.xin www.ai.hitech.xin;

    # SSL 证书
    ssl_certificate     /data/hitech/cert/ai.hitech.xin.pem;
    ssl_certificate_key /data/hitech/cert/ai.hitech.xin.key;

    # SSL 安全策略（Mozilla Intermediate，兼容 TLS 1.2/1.3）
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout   1d;
    ssl_session_cache     shared:SSL:50m;
    ssl_session_tickets   off;

    # HSTS：强制浏览器使用 HTTPS（有效期 2 年）
    # 注意：如需覆盖子域或加入 preload 列表，需确保所有子域均已配置 SSL 证书
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 上传文件大小限制
    client_max_body_size 200M;

    # 隐藏 Nginx 版本
    server_tokens off;

    # 根路径内部重写为 /hitech/，浏览器 URL 保持不变
    location = / {
        rewrite ^ /hitech/ last;
    }

    # 浏览器默认请求 favicon.ico，避免 404
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 前端引用的根路径 logo
    location = /logo.png {
        alias /data/hitech/node1/app/hitech-web/dist/logo.png;
    }

    # 前端静态文件
    location /static/ {
        access_log /var/log/nginx/static-access.log;
        error_log /var/log/nginx/static-error.log;
        alias /data/hitech/static/;
        index index.html;
        try_files $uri $uri/ /static/index.html;
    }

    # 前端文件
    location /file/ {
        access_log /var/log/nginx/file-access.log;
        error_log /var/log/nginx/file-error.log;
        alias /data/hitech/file/;
        index index.html;
        try_files $uri $uri/ /file/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # 项目: Hitech.web(和毅官网)
    # 后端端口: 3000
    # 部署节点: node1
    # ========================================

    # /admin 短地址重定向到 /hitech/admin（不带斜杠，与前端路由匹配）
    location = /admin {
        return 301 /hitech/admin;
    }

    location /admin/ {
        return 301 /hitech/admin;
    }

    # 前端静态文件入口（访问 /hitech 重定向到 /hitech/）
    location = /hitech {
        return 301 /hitech/;
    }

    # 前端静态文件入口（访问 /hitech返回 index.html）
    location /hitech {
        access_log /var/log/nginx/hitech-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        alias /data/hitech/node1/app/hitech-web/dist/index.html;
        default_type text/html;
    }

    # 前端静态文件
    location /hitech/ {
        access_log /var/log/nginx/hitech-web-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        alias /data/hitech/node1/app/hitech-web/dist/;
        index index.html;
        try_files $uri $uri/ /hitech/index.html;

        # 带 hash 的构建产物长期缓存（vite build 自动加 hash，内容变则 URL 变）
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # 后端 API 代理（含 AI SSE 流式响应支持）
    location /hitech/api/ {
        access_log /var/log/nginx/hitech-web-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # SSE 流式响应支持（对普通 JSON 接口无负面影响）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 健康检查入口
    location /hitech/health {
        access_log off;
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================


    # ========================================
    # 项目: ZHCC.web(中辉物流)
    # 后端端口: 8081
    # 部署节点: node1
    # ========================================

    # 前端静态文件入口（访问 /zhcc 重定向到 /zhcc/）
    location = /zhcc {
        return 301 /zhcc/;
    }

    # 前端静态文件入口（访问 /zhcc返回 index.html）
    location /zhcc {
        access_log /var/log/nginx/zhcc-access.log;
        error_log /var/log/nginx/zhcc-error.log;
        alias /data/hitech/node1/app/zhcc-web/dist/index.html;
        default_type text/html;
    }

    # 前端静态文件
    location /zhcc/ {
        access_log /var/log/nginx/zhcc-web-access.log;
        error_log /var/log/nginx/zhcc-web-error.log;
        alias /data/hitech/node1/app/zhcc-web/dist/;
        index index.html;
        try_files $uri $uri/ /zhcc/index.html;

        # 带 hash 的构建产物长期缓存（vite build 自动加 hash，内容变则 URL 变）
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # 后端 API 代理（含 AI SSE 流式响应支持）
    location /zhcc/api/ {
        access_log /var/log/nginx/zhcc-web-access.log;
        error_log /var/log/nginx/zhcc-web-error.log;
        proxy_pass http://localhost:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # SSE 流式响应支持（对普通 JSON 接口无负面影响）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 健康检查入口
    location /zhcc/health {
        access_log off;
        proxy_pass http://localhost:8081/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================
}
